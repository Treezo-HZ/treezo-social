<title>Treezo – Connect with us</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f4f7f5;color:#1f2a26;line-height:1.5;padding:16px;
  }
  .wrap{max-width:520px;margin:0 auto;}
  .brand{
    background:#157a52;color:#fff;border-radius:14px 14px 0 0;
    padding:16px 18px;display:flex;align-items:center;justify-content:space-between;
  }
  .brand .name{font-size:20px;font-weight:700;letter-spacing:.5px}
  .brand .show{font-size:13px;opacity:.9}
  .card{
    background:#fff;border-radius:0 0 14px 14px;
    box-shadow:0 6px 24px rgba(0,0,0,.08);padding:22px 18px 26px;
  }
  h1{font-size:19px;color:#0f5e3f;margin-bottom:4px}
  p.lead{color:#6b7a73;font-size:14px;margin-bottom:18px}
  .list{display:flex;flex-direction:column;gap:12px}
  .item{
    display:flex;align-items:center;gap:14px;
    text-decoration:none;color:#fff;font-weight:600;font-size:16px;
    padding:15px 16px;border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
  }
  .item:active{transform:translateY(1px)}
  .item svg{width:24px;height:24px;flex:0 0 24px}
  .item .txt{display:flex;flex-direction:column;line-height:1.2}
  .item .txt small{font-weight:400;opacity:.9;font-size:12px}
  .li{background:#0A66C2}
  .fb{background:#1877F2}
  .ig{background:#E4405F}
  .wa{background:#25D366}
  footer{text-align:center;color:#6b7a73;font-size:12px;margin-top:18px}
</style>
